(()=>{'use strict';const app=document.getElementById('app');let page=Number(localStorage.getItem('poly_page')||0),teacher=false,sound=false,selected={},revealed={},zoom=1,rot=0,correctCount=0;const names=['Bí ẩn hai polymer','Giải mã amylose','Giải mã amylopectin','Giải mã cellulose','So sánh ba cấu trúc'];const headings=['Khởi động: Hai polymer thiên nhiên','Phát hiện công thức chung','Đưa ra giả thuyết','Khám phá đơn vị cấu tạo amylose','Truy tìm liên kết α-1,4','Quan sát mạch amylose','Khám phá mạch chính amylopectin','Tìm điểm phân nhánh','Hoàn thiện sơ đồ amylopectin','Nhận diện β-glucose','Truy tìm liên kết β-1,4','So sánh amylose và cellulose','Hoàn thành bảng cấu tạo','Kiểm chứng giả thuyết','Kết luận và tự đánh giá'];const group=p=>p<3?0:p<6?1:p<9?2:p<12?3:4;const qdata={0:{q:'Chất nào sau đây là polymer thiên nhiên?',opts:['Tinh bột và cellulose','Glucose và fructose','Ethanol và acetic acid'],a:0,why:'Tinh bột và cellulose đều là polymer thiên nhiên.'},1:{q:'Công thức dạng chung của tinh bột và cellulose là gì?',opts:['(C₆H₁₂O₆)ₙ','(C₆H₁₀O₅)ₙ','C₁₂H₂₂O₁₁'],a:1,why:'Cả hai có dạng công thức phân tử (C₆H₁₀O₅)ₙ; số mắt xích n không nhất thiết giống nhau.'},3:{q:'Amylose được cấu tạo từ những đơn vị nào?',opts:['α-glucose','β-glucose','Fructose'],a:0,why:'Amylose được tạo từ các đơn vị α-glucose.'},4:{q:'Liên kết giữa các đơn vị α-glucose trong amylose là loại nào?',opts:['α-1,6-glycoside','β-1,4-glycoside','α-1,4-glycoside'],a:2,why:'Liên kết glycoside nối C1 của một đơn vị với vị trí C4 của đơn vị kế tiếp.'},5:{q:'Amylose có đặc điểm mạch nào?',opts:['Mạch phân nhánh','Mạch không phân nhánh, có dạng xoắn','Mạch gồm các đơn vị β-glucose'],a:1,why:'Amylose là mạch không phân nhánh và có dạng xoắn.'},6:{q:'Liên kết dọc các đoạn mạch chính của amylopectin là gì?',opts:['α-1,4-glycoside','α-1,6-glycoside','β-1,4-glycoside'],a:0,why:'Các đơn vị α-glucose trên đoạn mạch nối với nhau bằng liên kết α-1,4.'},7:{q:'Liên kết tạo điểm phân nhánh của amylopectin là gì?', ox="0 0 590 220" aria-label="Mô hình minh họa mạch xoắn amylose">${lines}</svg></div><p class="structure-note">Mô hình minh họa dạng xoắn của mạch amylose; không phải mô hình nguyên tử chính xác.</p>`}function picture(p){if(p>=6&&p<=8)return amylopectinReference();if(p===0)return `<div style="font-size:4rem">🌾　🌳</div><p>Tinh bột và cellulose: hai polymer thiên nhiên</p>`;if(p===1||p===2)return `<div style="font-size:clamp(1.4rem,4vw,2.4rem);font-weight:700;color:#087f8c">(C₆H₁₀O₅)ₙ</div><p>Hai chất có cùng dạng công thức phân tử</p>`;if(p===5)return helix();if(p===11)return `<div class="legend"><span>🔵 Amylose: α-1,4</span><span>🟢 Cellulose: β-1,4</span></div>${chain('amylose')}${chain('cellulose')}`;return chain(p>=9?'cellulose':'amylose',p>=7&&p<=8)}function nav(){return `<div class="nav"><button data-go="${page-1}" ${page===0?'disabled':''}>← Trước</button><button class="primary" data-go="${page+1}">${page===15?'Xem lại':'Tiếp theo →'}</button></div>`}function toolbar(){return `<div class="toolbar"><button class="small" data-tool="zoomIn">＋ Phóng to</button><button class="small" data-tool="zoomOut">－ Thu nhỏ</button><button class="small" data-tool="reset">⟲ Đặt lại</button>${page===5?'<button class="small" data-tool="rotate">↻ Xoay mô hình</button>':''}${teacher?'<button class="small" data-tool="answer">Hiện/ẩn kết luận (GV)</button>':''}</div>`}function quiz(p){let q=qdata[p];if(!q)return '';let sel=selected[p];return `<h3>${esc(q.q)}</h3><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${sel===i?'selected':''}" data-answer="${i}" aria-pressed="${sel===i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${sel!==undefined||revealed[p]?`<div class="feedback ${sel!==q.a?'warning':''}" role="status"><strong>${sel===q.a?'✓ Chính xác':sel===undefined?'Kết luận dành cho giáo viên':'Hãy quan sát lại mô hình'}</strong><p>${sel===q.a||teacher&&revealed[p]?q.why:hint(p)}</p></div>`:''}`}function hint(p){return p===7?'Quan sát vị trí C6 tại điểm nối nhánh.':p===9||p===10?'Quan sát dạng β của đơn vị glucose và vị trí C1–C4.':'Đối chiếu đơn vị glucose, số carbon và dạng mạch trên sơ đồ.'}let hypothesis='';function special(p){if(p===2)return `<h3>Dự đoán ban đầu</h3><p>Cùng dạng công thức phân tử, tinh bột và cellulose có cấu tạo giống nhau không?</p><div class="choices"><button class="choice" data-hyp="Giống nhau">Giống nhau</button><button class="choice" data-hyp="Khác nhau">Khác nhau</button><button class="choice" data-hyp="Chưa chắc chắn">Chưa chắc chắn</button></div><div class="feedback">Dự đoán đã lưu: <b>${esc(localStorage.getItem('poly_hyp')||'Chưa chọn')}</b>. Chưa công bố đáp án; hãy tiếp tục khám phá.</div>`;if(p===12){let opts=[['α-glucose','β-glucose'],['α-1,4','α-1,4 và α-1,6','β-1,4'],['Không phân nhánh, dạng xoắn','Phân nhánh','Không phân nhánh']];let row=['Đơn vị cấu tạo','Liên kết glycoside','Đặc điểm mạch'];return `<p>Chọn nội dung đúng cho mỗi ô rồi bấm <b>Kiểm tra bảng</b>.</p><div class="tablewrap"><table><thead><tr><th>Tiêu chí</th><th>Amylose</th><th>Amylopectin</th><th>Cellulose</th></tr></thead><tbody>${row.map((r,i)=>`<tr><th>${r}</th>${[0,1,2].map(j=>`<td><select data-cell="${i}-${j}" aria-label="${r} của ${['amylose','amylopectin','cellulose'][j]}"><option value="">-- Chọn --</option>${(i===0?opts[0]:i===1?opts[1]:opts[2]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="primary" data-tool="checkTable">Kiểm tra bảng</button><div id="tableFeedback" aria-live="polite"></div>`}if(p===13)return `<h3>Đối chiếu giả thuyết</h3><p>Dự đoán của em: <strong>${esc(localStorage.getItem('poly_hyp')||'Chưa ghi nhận')}</strong>.</p><p>Em hãy giải thích: Tại sao cùng có dạng công thức (C₆H₁₀O₅)ₙ nhưng cấu tạo khác nhau?</p><textarea id="explain" rows="4" style="width:100%;padding:10px;border:1px solid #aac7d0;border-radius:9px" placeholder="Nhập lập luận dựa vào đơn vị α/β-glucose, liên kết glycoside và dạng mạch..."></textarea><button data-tool="saveExplain" class="primary">Lưu giải thích</button><div id="explainFeedback" class="feedback">Kết luận sẽ xuất hiện sau khi em ghi nhận lời giải thích.</div>`;if(p===14)return `<h3>Ba câu hỏi tự đánh giá</h3>${[['Amylopectin khác amylose ở điểm nào?','Có mạch phân nhánh với liên kết α-1,6'],['Amylose và cellulose giống nhau ở điểm nào?','Đều có mạch không phân nhánh'],['Liên kết nào tạo nhánh trong amylopectin?','α-1,6-glycoside']].map((r,i)=>`<div style="margin:12px 0"><label for="final${i}">${i+1}. ${r[0]}</label><input id="final${i}" data-final="${i}" style="width:100%;padding:10px;border:1px solid #bed5df;border-radius:9px" placeholder="Viết câu trả lời của em"/></div>`).join('')}<button class="primary" data-tool="finalCheck">Xem gợi ý đáp án và tổng kết</button><div id="finalFeedback" aria-live="polite"></div>`;return quiz(p)}function home(){return `<section class="hero"><span class="tag">HÓA HỌC THPT · HỌC LIỆU TƯƠNG TÁC</span><h1>Khám phá cấu tạo phân tử tinh bột và cellulose</h1><p>Quan sát → Khám phá → Phân tích → Suy luận → Hình thành kiến thức.</p><p>Chọn học liệu hoặc bắt đầu theo hành trình 5 nhiệm vụ.</p><button class="primary" data-go="0">Bắt đầu khám phá →</button><div class="cards">${names.map((n,i)=>`<button class="card" data-go="${[0,3,6,9,12][i]}"><span class="number">HỌC LIỆU 0${i+1}</span><strong>${n}</strong><span class="muted">${[2,4,5,4,5][i]} phút · ${['Sách lật khám phá','Mô hình 2D + 3D','Sơ đồ phân nhánh','Mô hình cấu tạo','Bảng và tự đánh giá'][i]}</span></button>`).join('')}</div></section>`}function render(){if(page===15){app.innerHTML=home();return}let g=group(page);app.innerHTML=`<section class="hero"><span class="tag">HỌC LIỆU 0${g+1} · MÀN HÌNH ${page+1}/15</span><h1>${esc(headings[page])}</h1><p class="muted">${names[g]} · Quan sát, thao tác và trả lời để hình thành kiến thức</p><div class="progress">${names.map((n,i)=>`<button data-go="${[0,3,6,9,12][i]}" class="${i===g?'active':''}" title="${esc(n)}">HL0${i+1}</button>`).join('')}</div><div class="layout"><section class="panel"><h2>🔬 Khu vực khám phá</h2><div class="stage">${page>=12?`<div style="font-size:4rem">${page===12?'🧩':page===13?'🔎':'🎓'}</div><p>${page===12?'Hãy tự hoàn thành bảng trước khi xem kết luận':page===13?'Đối chiếu dự đoán với bằng chứng đã thu thập':'Tự đánh giá kết quả khám phá'}</p>`:picture(page)}</div>${page<12?toolbar():''}<p class="structure-note">${page>=3&&page<12?'Sơ đồ cấu trúc được giản lược để học tập. Cần tham chiếu hình SGK để nhận diện cấu hình α/β; hình vẽ không biểu diễn đầy đủ mọi nguyên tử và nhóm OH.':''}</p><div id="pickFeedback" class="feedback hidden" role="status"></div></section><section class="panel"><h2>📝 Nhiệm vụ học tập</h2>${special(page)}${nav()}</section></div></section>`;if(page===12){let vals=JSON.parse(localStorage.getItem('poly_table')||'{}');document.querySelectorAll('[data-cell]').forEach(el=>el.value=vals[el.dataset.cell]||'')}if(page===13){let el=document.getElementById('explain');el.value=localStorage.getItem('poly_explain')||''}if(page===14){for(let i=0;i<3;i++)document.getElementById('final'+i).value=localStorage.getItem('poly_final'+i)||''}}function checkTable(){const expected=[['α-glucose','α-glucose','β-glucose'],['α-1,4','α-1,4 và α-1,6','β-1,4'],['Không phân nhánh, dạng xoắn','Phân nhánh','Không phân nhánh']];let n=0,vals={};document.querySelectorAll('[data-cell]').forEach(el=>{let [i,j]=el.dataset.cell.split('-').map(Number);vals[el.dataset.cell]=el.value;el.style.borderColor=el.value===expected[i][j]?'#16847b':'#c47c2c';if(el.value===expected[i][j])n++});localStorage.setItem('poly_table',JSON.stringify(vals));document.getElementById('tableFeedback').innerHTML=`<div class="feedback ${n<9?'warning':''}">Em hoàn thành đúng ${n}/9 ô. ${n===9?'Chính xác! Em đã xác định đúng ba cấu trúc.':'Các ô viền cam cần được xem lại trên mô hình trước khi sửa.'}</div>`}function finalCheck(){let answers=['Amylopectin có mạch phân nhánh, với liên kết α-1,6 ở điểm phân nhánh; amylose không phân nhánh.','Cả hai đều có mạch không phân nhánh, nhưng khác đơn vị α/β-glucose và liên kết α/β-1,4.','Liên kết α-1,6-glycoside.'];for(let i=0;i<3;i++)localStorage.setItem('poly_final'+i,document.getElementById('final'+i).value);document.getElementById('finalFeedback').innerHTML=`<div class="result"><strong>Gợi ý đối chiếu (tự đánh giá):</strong><ol>${answers.map(x=>`<li>${x}</li>`).join('')}</ol><p>Em hãy so sánh câu trả lời của mình với các gợi ý; phần trả lời tự luận không được chấm tự động.</p><button data-tool="export">Xuất kết quả học tập (.txt)</button> <button data-tool="restart">Học lại từ đầu</button></div>`}function exportResult(){let rows=['PHIẾU KẾT QUẢ KHÁM PHÁ','CẤU TẠO TINH BỘT VÀ CELLULOSE','Dự đoán: '+(localStorage.getItem('poly_hyp')||''),'Giải thích: '+(localStorage.getItem('poly_explain')||'')];for(let i=0;i<3;i++)rows.push('Câu '+(i+1)+': '+(localStorage.getItem('poly_final'+i)||''));let blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ket_qua_kham_pha_tinh_bot_cellulose.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.addEventListener('click',e=>{let b=e.target.closest('button,[data-atom],[data-link]');if(!b)return;if(b.dataset.refbond){let f=document.getElementById('pickFeedback');if(f){f.classList.remove('hidden');f.textContent=b.dataset.refbond==='branch'?'Liên kết α-1,6-glycoside nối C1 của đơn vị glucose ở nhánh với C6 của đơn vị glucose tại điểm phân nhánh.':'Liên kết α-1,4-glycoside nối C1 của một đơn vị glucose với C4 của đơn vị kế tiếp trong đoạn mạch.';}return}if(b.dataset.go!==undefined){setPage(+b.dataset.go);return}if(b.dataset.answer!==undefined){selected[page]=+b.dataset.answer;render();return}if(b.dataset.hyp){localStorage.setItem('poly_hyp',b.dataset.hyp);render();return}if(b.dataset.atom!==undefined||b.dataset.link!==undefined){let f=document.getElementById('pickFeedback');if(!f)return;f.classList.remove('hidden');f.textContent=b.dataset.atom!==undefined?`Em đã chọn đơn vị glucose số ${+b.dataset.atom+1}. Hãy quan sát các vị trí C1, C4 và C6.`:b.dataset.link==='branch'?'Đây là vị trí nối nhánh qua C1–C6, tương ứng liên kết α-1,6-glycoside.':`Đây là cầu nối oxygen giữa hai đơn vị glucose, liên quan vị trí C1–C4.`;return}let tool=b.dataset.tool;if(!tool)return;if(tool==='zoomIn')zoom=Math.min(1.45,zoom+.15);if(tool==='zoomOut')zoom=Math.max(.7,zoom-.15);if(tool==='reset'){zoom=1;rot=0}if(tool==='rotate')rot+=40;if(tool==='answer')revealed[page]=!revealed[page];if(['zoomIn','zoomOut','reset','rotate','answer'].includes(tool)){render();return}if(tool==='checkTable')checkTable();if(tool==='saveExplain'){let v=document.getElementById('explain').value.trim();localStorage.setItem('poly_explain',v);document.getElementById('explainFeedback').innerHTML=v?'<strong>Đã lưu.</strong> Kết luận: tinh bột gồm amylose và amylopectin với đơn vị α-glucose; cellulose gồm β-glucose. Loại liên kết và dạng mạch có sự khác nhau.':'Hãy ghi nhận lập luận trước khi xem kết luận.'}if(tool==='finalCheck')finalCheck();if(tool==='export')exportResult();if(tool==='restart'){if(confirm('Xóa tiến độ đã lưu và học lại?')){Object.keys(localStorage).filter(x=>x.startsWith('poly_')).forEach(x=>localStorage.removeItem(x));setPage(0)}}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-atom],[data-link]')){e.preventDefault();e.target.click()}});document.getElementById('homeBtn').onclick=()=>setPage(15);document.getElementById('modeBtn').onclick=e=>{teacher=!teacher;e.target.textContent='Chế độ: '+(teacher?'Giáo viên':'Học sinh');render()};document.getElementById('soundBtn').onclick=e=>{sound=!sound;e.target.textContent='Âm thanh: '+(sound?'Bật':'Tắt');if(sound&&'speechSynthesis'in window){let u=new SpeechSynthesisUtterance('Chào mừng đến với phòng khám phá polymer thiên nhiên');u.lang='vi-VN';speechSynthesis.speak(u)}};document.getElementById('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};render()})();
</script></body></html>
